# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: brunooborges
# "service" is the name of this project. This will also be added to your AWS resource names.
service: foodiary-api

plugins:
  - serverless-offline

provider:
  name: aws
  region: us-east-1
  runtime: nodejs22.x
  architecture: arm64
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    MAX_AUDIO_FILE_BYTES: ${env:MAX_AUDIO_FILE_BYTES, '5242880'}
    MAX_IMAGE_FILE_BYTES: ${env:MAX_IMAGE_FILE_BYTES, '8388608'}
    BUCKET_NAME: !Ref UploadsBucket
    MEALS_QUEUE_URL: !Ref MealsQueue
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub '${UploadsBucket.Arn}/*'
        - Effect: Allow
          Action: sqs:SendMessage
          Resource: !GetAtt MealsQueue.Arn

package:
  individually: true

build:
  esbuild:
    minify: true
    sourcemap: false

functions:
  signin:
    handler: src/functions/signin.handler
    events:
      - httpApi:
          method: POST
          path: /signin
  signup:
    handler: src/functions/signup.handler
    events:
      - httpApi:
          method: POST
          path: /signup
  me:
    handler: src/functions/me.handler
    events:
      - httpApi:
          method: GET
          path: /me
  createMeal:
    handler: src/functions/createMeal.handler
    events:
      - httpApi:
          method: POST
          path: /meals
  listMeals:
    handler: src/functions/listMeals.handler
    events:
      - httpApi:
          method: GET
          path: /meals
  getMealById:
    handler: src/functions/getMealById.handler
    events:
      - httpApi:
          method: GET
          path: /meals/{mealId}
  getConsent:
    handler: src/functions/getConsent.handler
    events:
      - httpApi:
          method: GET
          path: /consent
  acceptConsent:
    handler: src/functions/acceptConsent.handler
    events:
      - httpApi:
          method: POST
          path: /consent
  withdrawConsent:
    handler: src/functions/withdrawConsent.handler
    events:
      - httpApi:
          method: DELETE
          path: /consent
  fileUploadedEvent:
    handler: src/functions/fileUploadedEvent.handler
    events:
      - s3:
          bucket: !Ref UploadsBucket
          event: s3:ObjectCreated:*
          existing: true
          forceDeploy: true
  processMeal:
    handler: src/functions/processMeal.handler
    timeout: 90
    # The AI provider keys are only needed here; the HTTP functions never call a provider.
    environment:
      OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
      OPENROUTER_API_KEY: ${env:OPENROUTER_API_KEY, ''}
      AI_DEFAULT_PROVIDER: ${env:AI_DEFAULT_PROVIDER, 'openai'}
      OPENROUTER_MODEL: ${env:OPENROUTER_MODEL, ''}
      OPENROUTER_AUDIO_MODEL: ${env:OPENROUTER_AUDIO_MODEL, ''}
    events:
      - sqs:
          arn: !GetAtt MealsQueue.Arn
          batchSize: 1

resources:
  Resources:
    UploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: foodiary-brunoborges-uploads
    MealsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: foodiary-meals-queue
        VisibilityTimeout: 120
        RedrivePolicy:
          maxReceiveCount: 1
          deadLetterTargetArn: !GetAtt MealsDLQ.Arn
    MealsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: foodiary-meals-queue-dlq

#BucketName: foodiary-bucket-${self:provider.region}-${self:service}-${opt:stage, 'dev'}




